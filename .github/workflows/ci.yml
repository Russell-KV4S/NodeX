name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Core + shared UI + desktop head, and all unit tests.
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build core, UI and desktop head
        run: dotnet build src/NodeX.UI/NodeX.UI.Desktop -c Release --nologo

      - name: Unit tests
        run: dotnet test tests/NodeX.Core.Tests -c Release --nologo

  # Compile check of the Android head, both editions, so an Android-only break (a platform API, a name clash with
  # Android.*) is caught on every push. Debug builds only: Release signing needs keystore/, which is never in the
  # repo, and nothing is packaged or published here. iOS needs a macOS runner and is not built.
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Build Android head (full edition)
        run: dotnet build src/NodeX.UI/NodeX.UI.Android -c Debug --nologo

      - name: Build Android head (Play edition)
        run: dotnet build src/NodeX.UI/NodeX.UI.Android -c Debug -p:PlayStore=true --nologo
